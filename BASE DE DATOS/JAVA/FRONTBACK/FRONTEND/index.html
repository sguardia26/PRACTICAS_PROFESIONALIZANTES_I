<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Escolar - Prácticas Profesionalizantes I</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Toastify CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body class="bg-light">

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-database me-2"></i>Centro Educativo Nonogasta - Panel BD
            </a>
            <span class="navbar-text text-white small">
                JS Backend + SQL + Frontend DOM
            </span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row g-4">
            
            <!-- Columna Izquierda: Formulario DML (INSERT) -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="fa-solid fa-user-plus me-2"></i>Registrar Alumno (DML)
                    </div>
                    <div class="card-body">
                        <form id="formAlumno">
                            <div class="mb-2">
                                <label for="dni" class="form-label small">DNI</label>
                                <input type="text" id="dni" class="form-control form-control-sm" required>
                            </div>
                            <div class="mb-2">
                                <label for="nombre" class="form-label small">Nombre</label>
                                <input type="text" id="nombre" class="form-control form-control-sm" required>
                            </div>
                            <div class="mb-2">
                                <label for="apellido" class="form-label small">Apellido</label>
                                <input type="text" id="apellido" class="form-control form-control-sm" required>
                            </div>
                            <div class="mb-2">
                                <label for="email" class="form-label small">Email</label>
                                <input type="email" id="email" class="form-control form-control-sm" required>
                            </div>
                            <div class="mb-2">
                                <label for="edad" class="form-label small">Edad</label>
                                <input type="number" id="edad" class="form-control form-control-sm" min="13" max="99" required>
                            </div>
                            <div class="mb-3">
                                <label for="id_curso_fk" class="form-label small">Curso Asignado</label>
                                <select id="id_curso_fk" class="form-select form-select-sm" required>
                                    <option value="">Cargando cursos...</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Guardar en MySQL
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Tabla DQL (SELECT / JOIN) -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <span class="fw-bold"><i class="fa-solid fa-users me-2"></i>Alumnos Registrados (DQL)</span>
                        <button id="btnRecargar" class="btn btn-outline-light btn-sm">
                            <i class="fa-solid fa-rotate-right me-1"></i> Actualizar
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 text-center">
                                <thead class="table-secondary">
                                    <tr>
                                        <th>ID</th>
                                        <th>DNI</th>
                                        <th>Estudiante</th>
                                        <th>Email</th>
                                        <th>Edad</th>
                                        <th>Curso</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaAlumnos">
                                    <tr>
                                        <td colspan="7" class="py-3 text-muted">Cargando información desde el servidor...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- JS -->
    <script src="JS/app.js"></script>
</body>
</html>
