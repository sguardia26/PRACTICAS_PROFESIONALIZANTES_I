<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integración DOM - Prácticas Profesionalizantes</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4>Panel de Control - 5to Año</h4>
            </div>
            <div class="card-body">
                <p id="mensaje-bienvenida" class="lead">Bienvenido al sistema. Esperando acción...</p>
                
                <input type="text" id="input-nombre" class="form-control mb-3" placeholder="Ingresa tu nombre">
                
                <!-- Este botón detonará el evento en JavaScript -->
                <button id="btn-accion" class="btn btn-success">Saludar y Cambiar Color</button>
                <button id="btn-restaurar" class="btn btn-secondary">Restaurar</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
