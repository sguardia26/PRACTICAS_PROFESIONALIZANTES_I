<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOTSTRAP</title>
    <!--CSS BOOTSTRAP LINK-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--LOGOTIPO-->
    <link rel="icon" type="image/png" href="media/logotipobootstrap.png">
</head>
<body class="bg-info text-white">
    <!--TITULO-->
    <div class="bg-primary text-light">
        <h1 class="text-center">BOOTSTRAP</h1>
    </div>
    <!--NAVEGADOR-->
    <nav class="navbar navbar-expand-lg bg-warning mb-4">
        <!--TITULO NAV-->
        <a href="index.html" target="_blank" class="navbar-brand">
            <img class="navbar-brand" src="media/logotipobootstrap.png" alt="BOOTSTRAP" style="width:20%;">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse"
        data-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        </div>
        <!--ACCESOS-->
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav">
                <li class="nav-item"><a href="#" class="nav-link"><button type="button" class="btn btn-danger btn-outline-info btn-lg">opcion1</button></a></li>
                <li class="nav-item"><a href="#" class="nav-link"><button type="button" class="btn btn-success btn-outline-primary btn-lg">opcion2</button></a></li>
                <li class="nav-item"><a href="#" class="nav-link"><button type="button" class="btn btn-primary btn-outline-light btn-lg">opcion3</button></a></li>
            </ul>
        </div>
    </nav>
    <!--FORMULARIO-->
    <h1 class="bg bg-primary text-secondary text-center mb-4" >BOOTSTRAP</h1>
    <div class="position-absolute top-50 start-50 translate-middle">
        <form action="#" class="btn bg-black text-white">
            <!--TITULO-->
            <div class="mb-3">
                <h3 class="text-center">FORMULARIO</h3>
            </div>
            <!--PARAMETROS-->
            <!--USUARIO-->
            <div class="mb-2">
                <label for="exampleInputEmail1" class="form-label">USUARIO</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                <div class="form-text text-danger" id="emailHelp">Ingresar su nombre de usuario o e-mail.</div>
            </div>
            <!--CONTRASEÑA-->
            <div class="mb-2">
                <label for="exampleInputPassword1" class="form-label">CONTRASEÑA</label>
                <input type="password" class="form-control" id="exampleInputPassword1">
                <div class="form-text text-danger id="passwordHelp">Ingresar su contraseña.</div>
            </div>
            <!--OPCION-->
            <div class="mb-2 form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label for="exampleCheck1" class="form-check-label"> ¿Acepta los terminos y condiciones?</label>
            </div>
            <div class="mb-2 form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck2">
                <label for="exampleCheck2" class="form-check-label">¿Pertenece a nuestra entidad?</label>
            </div>
            <!--BOTON-->
            <button type="submit" class="btn btn-success">Iniciar Sesion</button>
        </form>
    </div>
    <!--JS BOOTSTRAP LINK-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
