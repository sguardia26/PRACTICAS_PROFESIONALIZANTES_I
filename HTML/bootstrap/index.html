<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOTSTRAP</title>
    <!--CSS BOOTSTRAP LINK-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--LOGOTIPO-->
    <link rel="icon" type="image/png" href="media/logotipobootstrap.png">
</head>
<body class="bg-info text-white">
    <!--TITULO-->
    <div class="bg-primary text-light">
        <h1 class="text-center">BOOTSTRAP</h1>
    </div>
    <!--NAVEGADOR-->
    <nav class="navbar navbar-expand-lg bg-warning mb-4">
        <!--TITULO NAV-->
        <a href="index.html" target="_blank" class="navbar-brand">
            <img class="navbar-brand" src="media/logotipobootstrap.png" alt="BOOTSTRAP" style="width:20%;">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse"
        data-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        </div>
        <!--ACCESOS-->
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav">
                <li class="nav-item"><a href="#" class="nav-link"><button type="button" class="btn btn-danger btn-outline-info btn-lg">opcion1</button></a></li>
                <li class="nav-item"><a href="#" class="nav-link"><button type="button" class="btn btn-success btn-outline-primary btn-lg">opcion2</button></a></li>
                <li class="nav-item"><a href="#" class="nav-link"><button type="button" class="btn btn-primary btn-outline-light btn-lg">opcion3</button></a></li>
            </ul>
        </div>
    </nav>
    <!--FORMULARIO-->
    <!--TITULO-->
    <div class="bg bg-primary text-light text-center">
        <h1>BOOTSTRAP</h1>
    </div>
    <!--LOGIN-->
    <div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow p-4" style="width: 400px;">
         <link rel="icon" href="media/clipart.png" type="image/x-icon">
        <div class="text-center mb-3">
        <img src="media/logotipobootstrap.png" alt="Logo" width="100">
    </div>
    <form>
        <div class="text-center mb-4">
            <h3>Login</h3>
        </div>

        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" class="form-control">
            <div class="form-text">Ingresar el usuario</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control">
            <div class="form-text ">Ingresar la contraseña</div>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input">
            <label class="form-check-label">
                Aceptar términos y condiciones
            </label>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Iniciar sesión
        </button>
    </form>
    </div>
</div>
    <!--JS BOOTSTRAP LINK-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
